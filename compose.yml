services:
  sheets-json-api:
    build:
      context: .
    image: sheets-json-api:local
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      CACHE_TTL_S: ${CACHE_TTL_S:-60}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
    expose:
      - "3000"
    restart: unless-stopped
